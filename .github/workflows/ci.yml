name: CI

on:
  push:
    branches: [main, final-project]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Run tests
        run: python -m pytest tests -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag task-tracker:ci .
      - name: Start container
        run: docker run --detach --name task-tracker-ci --publish 8000:8000 task-tracker:ci
      - name: Verify health endpoint
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs task-tracker-ci
          exit 1
      - name: Stop container
        if: always()
        run: docker rm --force task-tracker-ci
